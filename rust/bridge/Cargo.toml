[package]
name = "artcraft-launcher-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JNI bridge: release asset picking, version ordering and SHA-256 checks for the Android ArtCraft Launcher"

[lib]
name = "artcraft_launcher_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
