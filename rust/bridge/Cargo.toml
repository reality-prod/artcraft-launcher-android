[package]
name = "artcraft-launcher-bridge"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "JNI bridge: release asset picking, version ordering, SHA-256 checks, and APK metadata extraction for the Android ArtCraft Launcher"

[lib]
name = "artcraft_launcher_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["apk_utils"]
full = ["apk_utils"]
apk_utils = []

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
