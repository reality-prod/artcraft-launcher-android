name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 35
          build-tools-version: 35.0.0
          accept-licenses: yes

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  build-with-rust:
    name: Build APK with Rust bridge
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 35
          build-tools-version: 35.0.0
          accept-licenses: yes

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
          profile: minimal

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-ndk
          echo "ANDROID_NDK_HOME=$(dirname $(dirname $(which ndk-build)))" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rust-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'rust/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rust-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.*') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust bridge
        run: cd rust && cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - name: Build APK with Rust
        run: ./gradlew assembleRelease -PbuildRust

      - name: Upload APK with Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-rust-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  test:
    name: Run tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-

      - name: Run Android tests
        run: ./gradlew testDebugUnitTest

      - name: Run Rust tests
        run: cd rust && cargo test

  release:
    name: Release to GitHub
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: artcraft-launcher-release
          path: apks

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ArtCraft Launcher ${{ steps.version.outputs.version }}
          body: |
            ## What's new
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ## Download
            
            - **Universal APK**: Install on any Android device (arm64-v8a, armeabi-v7a)
          files: |
            apks/*.apk
          generate_release_notes: true
          prerelease: false

      - name: Upload to GitHub Packages
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-${{ steps.version.outputs.version }}
          path: apks/*.apk

  publish-to-reality-prod:
    name: Auto-publish to reality-prod
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: artcraft-launcher-release
          path: apks

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: List APK files
        run: ls -la apks/

      - name: Create PR to reality-prod/artcraft-launcher-android
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REALITY_PROD_PAT }}
          commit-message: "chore: Update ArtCraft Launcher to v${{ steps.version.outputs.version }}"
          title: "chore: Update ArtCraft Launcher to v${{ steps.version.outputs.version }}"
          body: |
            Automatic update from ${{ github.repository }}@${{ github.ref_name }}
            
            ## Changes
            - Updated APK files with latest build
            - Built with Rust bridge for enhanced APK validation
            - See [release notes](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}) for full changelog
            
            ## Build Info
            - Version: v${{ steps.version.outputs.version }}
            - Built from: ${{ github.sha }}
          branch: "auto-update-launcher-${{ steps.version.outputs.version }}"
          base: main
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
